    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
    font-family:'PS2P','Courier New',monospace;color:var(--ink);-webkit-font-smoothing:none;font-smooth:never;text-rendering:optimizeSpeed}
  #app{position:fixed;top:0;bottom:0;left:0;right:0;margin:auto;height:100%;width:min(100vw,56.25vh);overflow:hidden;background:#0a0612;touch-action:none}
  canvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #hud{position:absolute;inset:0;pointer-events:none}
  #safe{position:absolute;left:0;top:0;width:1px;height:env(safe-area-inset-top);visibility:hidden}
  .lbl{font-size:8px;line-height:8px;color:var(--dim);white-space:nowrap}

  /* ---- PS1 panel: hard pixel bevel, scanlines + 4px dither ---- */
  .panel{position:relative;box-sizing:border-box;background-color:#1a1030;
    background-image:linear-gradient(0deg,rgba(0,0,0,.30) 1px,transparent 1px),linear-gradient(45deg,rgba(255,255,255,.04) 25%,transparent 25% 75%,rgba(255,255,255,.04) 75%);
    background-size:100% 3px,4px 4px;
    box-shadow:inset 3px 3px 0 #6a4aa8,inset -3px -3px 0 #07030f,0 0 0 3px #000,0 6px 0 3px #000}

  #top{position:absolute;left:0;right:0;top:0;z-index:30;padding:calc(10px + env(safe-area-inset-top)) 12px 0;box-sizing:border-box}
  #top .row{display:flex;gap:10px;align-items:stretch}
  #top .r2{margin-top:10px;align-items:flex-end;justify-content:space-between}
  #scoreBox{flex:1 1 auto;padding:9px 10px 9px;min-width:0}
  #score{font-size:24px;line-height:24px;margin:7px 0 7px;color:var(--ink);text-shadow:3px 3px 0 #3a0d14;white-space:nowrap;letter-spacing:0}
  #score i{font-style:normal;color:#4a3a6c;text-shadow:none}
  #best{font-size:8px;line-height:8px;color:var(--dim);white-space:nowrap}
  #best i{font-style:normal;color:#43365f}
  #best.new{color:var(--gold);animation:blink .5s steps(1) infinite}
  @keyframes blink{50%{opacity:.35}}
  #comboBox{flex:0 0 98px;padding:9px 8px;text-align:center}
  #combo{font-size:24px;line-height:24px;margin-top:17px;color:#5a4d70;white-space:nowrap}
  #comboBox.on{box-shadow:inset 3px 3px 0 #ff9a5a,inset -3px -3px 0 #5a1a07,0 0 0 3px #000,0 6px 0 3px #000;background-color:#3a1620}
  #combo.t1{color:var(--ink)} #combo.t2{color:var(--ember)} #combo.t3{color:var(--gold);animation:blink .3s steps(1) infinite}
  #meterBox{flex:1 1 auto;min-width:0;padding-bottom:3px}
  #spawnbar{display:flex;gap:2px;height:14px;margin-top:6px;padding:3px;background:#07030f;box-shadow:0 0 0 2px #000,inset 2px 2px 0 #000,0 0 0 4px #3a2a5c;box-sizing:border-box}
  #spawnbar b{flex:1;background:#1c1432}
  #spawnbar b.on{background:#8a5ad0;box-shadow:inset 0 2px 0 #b99af0}
  #spawnbar b.on:nth-child(n+9){background:#ff7a3a;box-shadow:inset 0 2px 0 #ffb27a}
  #spawnbar b.on:nth-child(n+13){background:#e0283a;box-shadow:inset 0 2px 0 #ff7a80}
  #spawnbar.warn b.on:last-child{animation:blink .2s steps(1) infinite}
  #btns{display:flex;gap:7px;flex:0 0 auto}

  /* ---- buttons: chunky bevel, visibly depress ---- */
  button{pointer-events:auto;font:inherit;color:var(--ink);touch-action:manipulation;-webkit-appearance:none;appearance:none;border:0;border-radius:0;cursor:pointer;outline:0}
  .ibtn{position:relative;width:52px;height:46px;padding:5px 0 0;display:flex;flex-direction:column;align-items:center;gap:4px;
    background-color:#3a2760;background-image:linear-gradient(45deg,rgba(255,255,255,.05) 25%,transparent 25% 75%,rgba(255,255,255,.05) 75%);background-size:4px 4px;
    box-shadow:inset 3px 3px 0 #9a7ae0,inset -3px -3px 0 #1a0f33,0 0 0 3px #000,0 5px 0 3px #000;transition:none}
  .ibtn .ico{width:20px;height:20px;display:block;color:var(--ink)}
  .ibtn .bl{font-size:8px;line-height:8px;color:#c9b8f0}
  .ibtn.down,.bigbtn.down{transform:translateY(5px);box-shadow:inset 3px 3px 0 #1a0f33,inset -3px -3px 0 #9a7ae0,0 0 0 3px #000;background-color:#2a1a48}
  .ibtn.off .ico{color:#8a7ab0}
  .bigbtn{position:relative;display:block;width:100%;height:58px;font-size:14px;color:#fff;text-shadow:2px 2px 0 #5a0a14;letter-spacing:0;
    background-color:#c3162a;background-image:linear-gradient(45deg,rgba(255,255,255,.07) 25%,transparent 25% 75%,rgba(255,255,255,.07) 75%);background-size:4px 4px;
    box-shadow:inset 4px 4px 0 #ff6a50,inset -4px -4px 0 #5a0a14,0 0 0 3px #000,0 6px 0 3px #000}
  .bigbtn.down{background-color:#a01024;box-shadow:inset 4px 4px 0 #5a0a14,inset -4px -4px 0 #ff6a50,0 0 0 3px #000;transform:translateY(6px)}
  .bigbtn::before{content:"";display:inline-block;margin-right:12px;border-left:10px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent;vertical-align:-1px}

  /* ---- toast / popups ---- */
  #toast{position:absolute;left:0;right:0;top:21%;text-align:center;font-size:20px;line-height:24px;color:#fff;opacity:0;pointer-events:none;z-index:25;
    text-shadow:-2px 0 #000,2px 0 #000,0 -2px #000,0 2px #000,3px 3px 0 var(--red),5px 5px 0 #000}
  #toast.t2{color:var(--ember);text-shadow:-2px 0 #000,2px 0 #000,0 -2px #000,0 2px #000,3px 3px 0 #5a1a07,5px 5px 0 #000}
  #toast.t3{color:var(--gold);text-shadow:-2px 0 #000,2px 0 #000,0 -2px #000,0 2px #000,3px 3px 0 var(--red),5px 5px 0 #000}
  #toast.wipe{color:var(--cy);text-shadow:-2px 0 #000,2px 0 #000,0 -2px #000,0 2px #000,3px 3px 0 #0a5a7a,5px 5px 0 #000}
  #toast{will-change:transform,opacity}
  .pop{position:absolute;left:0;top:0;opacity:0;font-size:12px;line-height:12px;color:var(--gold);white-space:nowrap;z-index:22;pointer-events:none;
    text-shadow:-1px 0 #000,1px 0 #000,0 -1px #000,0 1px #000,2px 2px 0 #000}
  .pop.big{font-size:16px;color:#fff;text-shadow:-1px 0 #000,1px 0 #000,0 -1px #000,0 1px #000,2px 2px 0 var(--red)}
  .pop.chain{color:var(--cy)}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:21}

  /* ---- in-game hint ---- */
  #hint{width:max-content;position:absolute;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));padding:10px 12px;font-size:8px;line-height:12px;color:var(--ink);
    white-space:nowrap;transition:opacity .5s steps(5);z-index:5;max-width:94%}
  #hint1{color:#fff}

  /* ---- title screen ---- */
  #title{position:absolute;inset:0;z-index:40;pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;
    background:rgba(5,2,10,.74);background-image:linear-gradient(0deg,rgba(0,0,0,.25) 1px,transparent 1px);background-size:100% 3px}
  #title.hide{display:none}
  #logo{margin-top:calc(138px + env(safe-area-inset-top));text-align:center;line-height:1;animation:float 1.4s steps(2) infinite}
  #logo div{font-size:36px;letter-spacing:0;color:var(--ink);
    text-shadow:-3px 0 #000,3px 0 #000,0 -3px #000,0 3px #000,3px 3px 0 var(--red),6px 6px 0 #5a0a14,9px 9px 0 #000}
  #logo div + div{margin-top:10px;color:var(--ember);text-shadow:-3px 0 #000,3px 0 #000,0 -3px #000,0 3px #000,3px 3px 0 #a01830,6px 6px 0 #5a0a14,9px 9px 0 #000}
  @keyframes float{50%{transform:translateY(-4px)}}
  #tdice{display:flex;gap:14px;margin-top:20px}
  #tdice canvas{width:30px;height:30px;image-rendering:pixelated;animation:bob .8s steps(2) infinite}
  #tdice canvas:nth-child(2){animation-delay:.27s} #tdice canvas:nth-child(3){animation-delay:.54s}
  @keyframes bob{50%{transform:translateY(-6px)}}
  #tap{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);width:max-content;padding:14px 16px;background:rgba(10,4,20,.85);box-shadow:inset 3px 3px 0 #6a4aa8,inset -3px -3px 0 #07030f,0 0 0 3px #000;text-align:center;font-size:14px;color:#fff;animation:blink 1s steps(1) infinite;
    text-shadow:-2px 0 #000,2px 0 #000,0 -2px #000,0 2px #000,3px 3px 0 #3a0d14}
  #how{width:max-content;position:absolute;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));padding:14px 14px 12px;font-size:8px;line-height:14px;text-align:left;white-space:nowrap}
  #how b{color:var(--gold);font-weight:400}
  #how .h{color:var(--dim);margin-bottom:6px}

  /* ---- game over ---- */
  #over{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:0 22px;box-sizing:border-box;background:rgba(5,2,10,.74);pointer-events:auto;
    background-image:linear-gradient(0deg,rgba(0,0,0,.25) 1px,transparent 1px);background-size:100% 3px}
  #over.show{display:flex}
  #overPanel{width:100%;max-width:320px;padding:22px 18px 22px;text-align:center;animation:slam .35s steps(5)}
  @keyframes slam{0%{transform:translateY(-60px) scale(1.15);opacity:0}100%{transform:none;opacity:1}}
  #overPanel h1{margin:0 0 16px;font-size:20px;line-height:24px;font-weight:400;color:#ff5a3a;text-shadow:-2px 0 #000,2px 0 #000,0 -2px #000,0 2px #000,3px 3px 0 #5a0a14}
  #newbest{display:none;margin:-4px 0 14px;font-size:12px;color:var(--gold);animation:blink .4s steps(1) infinite;text-shadow:2px 2px 0 #5a1a07}
  #overPanel.isnew{box-shadow:inset 3px 3px 0 #ffe27a,inset -3px -3px 0 #8a5a07,0 0 0 3px #000,0 6px 0 3px #000}
  #overPanel .line{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 12px;font-size:10px}
  #overPanel .line span{color:var(--dim)}
  #overPanel .line b{font-weight:400;font-size:18px;color:var(--ink);text-shadow:2px 2px 0 #3a0d14}
  #overPanel .line b i{font-style:normal;color:#4a3a6c;text-shadow:none}
  #overPanel .gap{height:10px}
  #confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  #confetti u{position:absolute;top:-10px;width:6px;height:6px;animation:fall 1.8s steps(14) forwards}
  @keyframes fall{to{transform:translateY(900px)}}
  /* low-cost path (auto-enabled on slow devices, or ?lowfx=1) */
  .lowfx .panel,.lowfx #title,.lowfx #over{background-image:none}
  .lowfx .pop,.lowfx #toast{text-shadow:2px 2px 0 #000}
  .lowfx #confetti,.lowfx #flash{display:none}
  .lowfx .ibtn,.lowfx .bigbtn{background-image:none}
  #load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--dim)}
</style>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>
  <div id="hud">
    <div id="safe"></div>
    <div id="top">
      <div class="row">
        <div id="scoreBox" class="panel"><div class="lbl">SCORE</div><div id="score"><i>00000</i>0</div><div id="best">BEST <i>00000</i>0</div></div>
        <div id="comboBox" class="panel"><div class="lbl">COMBO</div><div id="combo" class="zero">x0</div></div>
      </div>
      <div class="row r2">
        <div id="meterBox"><div class="lbl">NEXT DIE</div><div id="spawnbar"></div></div>
        <div id="btns">
          <button id="restart" class="ibtn" aria-label="Restart"><span class="ico" data-ico="reset"></span><span class="bl">RESET</span></button>
          <button id="view" class="ibtn" aria-label="Switch camera view"><span class="ico" data-ico="view"></span><span class="bl" id="viewLbl">FLAT</span></button>
          <button id="snd" class="ibtn" aria-label="Toggle sound"><span class="ico" data-ico="snd"></span><span class="bl" id="sndLbl">SOUND</span></button>
        </div>
      </div>
    </div>
    <div id="toast"></div>
    <div id="hint" class="panel" style="opacity:0"><span id="hint1">SWIPE TO ROLL · HOLD + DRAG TO SLIDE</span></div>
    <div id="flash"></div>
    <div id="over"><div id="confetti"></div>
      <div id="overPanel" class="panel"><h1>BOARD FULL</h1><div id="newbest">NEW BEST!</div>
        <div class="line"><span>SCORE</span><b id="overScore">000000</b></div>
        <div class="line"><span>BEST</span><b id="overBest">000000</b></div>
        <div class="gap"></div><button id="again" class="bigbtn">PLAY AGAIN</button></div></div>
    <div id="title"><div id="logo"><div>DEAD</div><div>ROLL</div></div><div id="tdice"></div>
      <div id="tap">TAP TO START</div>
      <div id="how" class="panel"><div class="h">HOW TO PLAY</div>
        <div><b>SWIPE</b> A DIE TO ROLL IT</div><div><b>HOLD + DRAG</b> TO SLIDE IT</div>
        <div>MATCH <b>N</b> DICE SHOWING <b>N</b></div><div>A <b>1</b> ON A SINKING CHAIN</div><div>WIPES ALL <b>1</b>s</div></div></div>
  </div>
  <div id="load">LOADING…</div>
</div>

<script type="module">
/* ---------- load three (CDN, with fallback) ---------- */
const CDNS = [
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js',
  'https://unpkg.com/three@0.160.0/build/three.module.js'
];
let THREE = null;
for (const u of CDNS) { try { THREE = await import(u); break; } catch (e) { console.warn('CDN failed', u); } }
if (!THREE) { document.getElementById('load').textContent = 'COULD NOT LOAD THREE.JS (offline?)'; throw new Error('three.js failed to load'); }
document.getElementById('load').remove();

/* PS1 games did lighting math in gamma space: disable colour management, keep everything raw. */
THREE.ColorManagement.enabled = false;

/* ---------- config ---------- */
const N = 6;                 // grid size
const S = 0.88, H = S / 2;   // die size / half
const ROLL_T = 0.17;         // roll duration (s)
const RISE_T = 0.9;          // spawn rise duration
const SINK_T = 6.0;          // chain sink duration (s)
const JOIN_EXT = 0.8;        // seconds added to a chain when a die joins
const MAX_REMAIN = 9;        // cap on remaining chain time
const HOLD_MS = 250;         // press-and-hold time that switches to slide mode
const TILE_PX = 12;          // drag threshold in px
const TARGET_W = 320;        // low-res render width
const params = new URLSearchParams(location.search);
let fxLevel = params.has('lowfx') ? 1 : 0;   // 0 = full effects, 1 = low-cost path (auto-switched on slow devices)
let seed = params.has('seed') ? parseInt(params.get('seed')) >>> 0 : (Math.random() * 2 ** 32) >>> 0;
function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }

/* ---------- renderer + low-res target ---------- */
const app = document.getElementById('app');
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.setClearColor(0x0a0612, 1);
const rt = new THREE.WebGLRenderTarget(TARGET_W, 480, {
  minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true, generateMipmaps: false
});
const snapU = { value: new THREE.Vector2(TARGET_W, 480) };

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0612);
scene.fog = new THREE.Fog(0x0a0612, 14, 30);
const camera = new THREE.PerspectiveCamera(38, 0.46, 0.1, 80);

/* post pass: upscale (nearest) + colour reduction + Bayer dither + vignette */
const postScene = new THREE.Scene();
const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const postMat = new THREE.ShaderMaterial({
  uniforms: { tDiffuse: { value: rt.texture }, uRes: snapU },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform vec2 uRes; varying vec2 vUv;
    float bayer(vec2 p){
      int x=int(mod(p.x,4.)); int y=int(mod(p.y,4.));
      float m[16]=float[16](0.,8.,2.,10., 12.,4.,14.,6., 3.,11.,1.,9., 15.,7.,13.,5.);
      return m[y*4+x]/16.-0.5;
    }
    void main(){
      vec3 c=texture2D(tDiffuse,vUv).rgb;
      c=(c-0.5)*1.06+0.5;
      c=floor(c*31.+bayer(floor(vUv*uRes))*0.9+0.5)/31.;
      float v=length(vUv-0.5);
      c*=1.0-0.55*smoothstep(0.35,0.85,v);
      gl_FragColor=vec4(c,1.);
    }`,
  depthTest: false, depthWrite: false
});
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat));

/* PS1-style vertex snapping injected into any material */
function psx(mat, k = 0.62) {
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uSnap = snapU;
    sh.vertexShader = 'uniform vec2 uSnap;\n' + sh.vertexShader.replace('#include <project_vertex>',
      `#include <project_vertex>
       { vec4 sp = gl_Position; vec2 g = uSnap * ${k.toFixed(2)} * 0.5;
         sp.xy = floor(sp.xy / sp.w * g + 0.5) / g * sp.w; gl_Position = sp; }`);
  };
  mat.customProgramCacheKey = () => 'psx' + k;
  return mat;
}

/* ---------- lights ---------- */
scene.add(new THREE.AmbientLight(0x9a8ad0, 2.6));
const key = new THREE.DirectionalLight(0xffe6c0, 3.9); key.position.set(-4, 9, 5); scene.add(key);
const rim = new THREE.DirectionalLight(0x6a4aff, 1.2); rim.position.set(5, 3, -6); scene.add(rim);
const glow = new THREE.PointLight(0xff4a2a, 6, 14); glow.position.set(0, -0.5, 0); scene.add(glow);

/* ---------- textures ---------- */
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function nearest(tex) { tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter; tex.generateMipmaps = false; return tex; }
function pipTexture(v) {
  const c = mkCanvas(32, 32), g = c.getContext('2d');
  g.fillStyle = '#e6d9b4'; g.fillRect(0, 0, 32, 32);
  for (let i = 0; i < 110; i++) { g.fillStyle = (i % 3) ? '#d3c39a' : '#efe4c6'; g.fillRect((Math.sin(i * 12.9 + v) * 43758 % 1 + 1) % 1 * 32 | 0, (Math.sin(i * 78.2 + v * 3) * 24634 % 1 + 1) % 1 * 32 | 0, 1, 1); }
  g.fillStyle = '#ebe1c4'; g.fillRect(1, 1, 30, 2); g.fillRect(1, 1, 2, 30);
  g.fillStyle = '#85734f'; g.fillRect(1, 29, 30, 2); g.fillRect(29, 1, 2, 30);
  g.fillStyle = '#3d3224'; g.fillRect(0, 0, 32, 1); g.fillRect(0, 31, 32, 1); g.fillRect(0, 0, 1, 32); g.fillRect(31, 0, 1, 32);
  const disc = (cx, cy, r, col) => { g.fillStyle = col; for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++) if ((x + .5 - cx) ** 2 + (y + .5 - cy) ** 2 <= r * r) g.fillRect(x, y, 1, 1); };
  const L = 9, M = 16, R = 23;
  const P = { 1: [[M, M]], 2: [[L, L], [R, R]], 3: [[L, L], [M, M], [R, R]], 4: [[L, L], [R, L], [L, R], [R, R]], 5: [[L, L], [R, L], [M, M], [L, R], [R, R]], 6: [[L, L], [L, M], [L, R], [R, L], [R, M], [R, R]] };
  if (v === 1) { disc(M, M, 7.2, '#5a0a14'); disc(M, M, 6, '#c3162a'); disc(M - 1.5, M - 1.5, 2, '#ff5a50'); }
  else for (const [x, y] of P[v]) { disc(x + .5, y + .5, 3.9, '#1c0710'); disc(x, y, 3.2, '#4a0f1c'); }
  return nearest(new THREE.CanvasTexture(c));
}
const faceTex = [null, 1, 2, 3, 4, 5, 6].map((v) => v && pipTexture(v));
function floorTexture() {
  const c = mkCanvas(192, 192), g = c.getContext('2d');
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    g.fillStyle = (x + y) % 2 ? '#241a3c' : '#30234e'; g.fillRect(x * 32, y * 32, 32, 32);
    for (let i = 0; i < 26; i++) { g.fillStyle = i % 2 ? '#32255a' : '#150e24'; g.fillRect(x * 32 + (i * 7 + x * 3) % 32, y * 32 + (i * 13 + y * 5) % 32, 1, 1); }
    g.fillStyle = '#41307a'; g.fillRect(x * 32, y * 32, 32, 1); g.fillRect(x * 32, y * 32, 1, 32);
    g.fillStyle = '#0e0818'; g.fillRect(x * 32, y * 32 + 31, 32, 1); g.fillRect(x * 32 + 31, y * 32, 1, 32);
  }
  return nearest(new THREE.CanvasTexture(c));
}
function ringTexture() {
  const c = mkCanvas(32, 32), g = c.getContext('2d');
  g.fillStyle = '#fff';
  g.fillRect(2, 2, 28, 2); g.fillRect(2, 28, 28, 2); g.fillRect(2, 2, 2, 28); g.fillRect(28, 2, 2, 28);
  g.globalAlpha = .35; g.fillRect(4, 4, 24, 24);
  return nearest(new THREE.CanvasTexture(c));
}

/* ---------- board / world ---------- */

    shownScore += Math.max(1, Math.ceil((score - shownScore) * 0.2)); if (shownScore > score) shownScore = score;
    const nowT = performance.now();
    if (nowT - lastScoreDom > 50 || shownScore === score) {          // DOM at ~20 Hz, not every frame
      lastScoreDom = nowT; renderScore(false);
      if (nowT - lastCountTick > 55) { lastCountTick = nowT; sfx('count', 1 + Math.min(0.8, combo * 0.08)); elScore.animate(UP_KF, { duration: 160, easing: 'steps(2)' }); }
    }
  }
  // particles (pooled)
  if (pLive > 0) for (let i = 0; i < PMAX; i++) {
    const p = pool[i]; if (!p.on) continue;
    p.life -= rawDt; p.vy -= 9 * rawDt; const m = p.m;
    m.position.x += p.vx * rawDt; m.position.y += p.vy * rawDt; m.position.z += p.vz * rawDt; m.rotation.x += p.rx * rawDt; m.rotation.y += p.ry * rawDt;
    if (p.life <= 0) { p.on = false; m.visible = false; pLive--; }
  }
  // selection ring pulse
  if (selRing.visible) { const s = 1 + 0.05 * Math.sin(simTime * 12); selRing.scale.set(s, s, s); }
  if (tgtRing.visible) { const s = 1 + 0.07 * Math.sin(simTime * 14); tgtRing.scale.set(s, s, s); }
  if (drag && !drag.mode && drag.die && drag.die.state === 'idle' && !gameOver && performance.now() - drag.t0 >= HOLD_MS && Math.hypot(drag.cx - drag.x0, drag.cy - drag.y0) < TILE_PX) {
    drag.mode = 'slide'; vib(12); sfx('tick', 1.8); selRing.material.color.setHex(0xff5ad8);
  }
  updateLabels(false);
  if (ghost.visible) ghost.position.y = H + 0.04 * Math.sin(simTime * 10);
  // world ambience
  for (const s of shards) { s.rotation.y += s.userData.spin * rawDt; s.rotation.x += s.userData.spin * 0.4 * rawDt; }
  dustAcc += rawDt;
  if (++dustFrame % 3 === 0) {                       // embers: move + re-upload every 3rd frame only
    const dp = dustGeo.attributes.position; for (let i = 0; i < dustN; i++) { dp.array[i * 3 + 1] += dustAcc * (0.15 + (i % 5) * 0.05); if (dp.array[i * 3 + 1] > 8) dp.array[i * 3 + 1] = -1; } dp.needsUpdate = true; dustAcc = 0;
  }
  glow.intensity = 5 + Math.sin(simTime * 1.6) * 1.2 + (sinkingOrVanish ? 4 : 0);
  // camera + shake
  shake = Math.max(0, shake - rawDt * 1.4);
  const V = VIEWS[view], k = Math.min(1, rawDt * 7), shk = fxLevel > 0 ? 0 : shake;
  cam.az += (V.az - cam.az) * k; cam.tilt += (V.tilt - cam.tilt) * k; cam.dist += (V.dist - cam.dist) * k; cam.shift += (V.shift - cam.shift) * k; applyShift(false);
  scene.fog.near = cam.dist + 5; scene.fog.far = cam.dist + 22;
  camBase.set(Math.sin(cam.az) * Math.sin(cam.tilt) * cam.dist, Math.cos(cam.tilt) * cam.dist, Math.cos(cam.az) * Math.sin(cam.tilt) * cam.dist);
  camera.position.set(camBase.x + (Math.random() - .5) * shk * 0.4, camBase.y + (Math.random() - .5) * shk * 0.4, camBase.z);
  camera.lookAt(camTarget);
}
function setGlow(d, amt, white) {
  const r = 0.17 + 1.0 * amt + white * 0.7, g = 0.14 + 0.32 * amt + white * 0.7, b = 0.1 + 0.08 * amt + white * 0.6;
  if (r === d.gr && g === d.gg && b === d.gb) return;     // only touch the material when the glow actually changed
  d.gr = r; d.gg = g; d.gb = b; d.mesh.material.emissive.setRGB(r, g, b);
}

/* ---------- main loop ---------- */
let last = performance.now();
const perf = { cpu: new Float32Array(300), n: 0, calls: 0, tris: 0, programs: 0, geoms: 0, texs: 0, maxCpu: 0 };
renderer.info.autoReset = false;
let emaDt = 16.7, slowFrames = 0, playMs = 0;
function setFx(level) { fxLevel = level; app.classList.toggle('lowfx', level > 0); layout(); }
function frame(now) {
  const rawMs = now - last, dt = Math.min(0.05, rawMs / 1000); last = now;
  if (started && !document.hidden && rawMs < 250 && fxLevel === 0 && !params.has('hifx')) {   // auto low-cost path: sustained <~38 fps after warm-up
    emaDt += (rawMs - emaDt) * 0.05; playMs += rawMs;
    if (playMs > 5000) { if (emaDt > 26) slowFrames++; else slowFrames = Math.max(0, slowFrames - 2); if (slowFrames > 120) { setFx(1); console.info('deadroll: low-cost effects enabled'); } }
  }
  const t0 = performance.now();
  renderer.info.reset();
  update(dt);
  renderer.setRenderTarget(rt); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
  const c = performance.now() - t0; perf.cpu[perf.n++ % 300] = c; if (c > perf.maxCpu) perf.maxCpu = c;
  perf.calls = renderer.info.render.calls; perf.tris = renderer.info.render.triangles; perf.programs = renderer.info.programs.length; perf.geoms = renderer.info.memory.geometries; perf.texs = renderer.info.memory.textures;
  requestAnimationFrame(frame);
}
/* Pre-warm: compile every shader program and upload every texture now (ghost, rings, labels, particles, dice),
   so nothing hitches the first time an effect appears. */
function prewarm() {
  [atlasTex, slabTop.map, ringTex, ...digits.slice(1).flat()].forEach((t) => renderer.initTexture(t));
  const objs = [ghost, selRing, tgtRing, ...Object.values(labels), ...pool.map((p) => p.m)], was = objs.map((o) => o.visible);
  objs.forEach((o) => { o.visible = true; });
  renderer.compile(scene, camera);
  renderer.setRenderTarget(rt); renderer.render(scene, camera); renderer.setRenderTarget(null);
  objs.forEach((o, i) => { o.visible = was[i]; });
}
layout(); setView(view, true); renderScore(false); resetGame();
prewarm();
requestAnimationFrame(frame);

/* ---------- debug / test hooks ---------- */
window.__game = {
  THREE,
  get dice() { return dice.map((d) => ({ gx: d.gx, gy: d.gy, top: d.top, state: d.state })); },
  get score() { return score; }, get combo() { return combo; }, get over() { return gameOver; }, get spawnCount() { return spawnCount; },
  tileToScreen(gx, gy) { const r = app.getBoundingClientRect(); const p = new THREE.Vector3(wx(gx), H, wx(gy)).project(camera); return { x: r.left + (p.x * .5 + .5) * r.width, y: r.top + (-p.y * .5 + .5) * r.height }; },
  clear() { for (const d of [...dice]) removeDie(d); },
  place(gx, gy, top) { const d = makeDie(gx, gy, randomQuat(top), 0); d.t = 1; d.state = 'idle'; d.bounce = 1; d.mesh.position.set(wx(gx), H, wx(gy)); return d.top; },
  freezeSpawns(v) { this._noSpawn = v; spawnT = v ? -1e9 : 0; },
  topAt(gx, gy) { const d = grid[gy][gx]; return d ? d.top : null; },
  stateAt(gx, gy) { const d = grid[gy][gx]; return d ? d.state : null; },
  evaluate,
  boardExtents() {
    camera.updateMatrixWorld(); const R = N / 2 + 0.3, r = app.getBoundingClientRect();
    const pts = []; for (const y of [1.0, 0.12, -2.4]) for (const [x, z] of [[-R, -R], [R, -R], [R, R], [-R, R]]) pts.push(new THREE.Vector3(x, y, z).project(camera));
    const xs = pts.slice(4, 8).map((p) => (p.x * .5 + .5) * r.width), ys = pts.map((p) => (-p.y * .5 + .5) * r.height);
    return { minX: Math.min(...xs), maxX: Math.max(...xs), minY: Math.min(...ys), maxY: Math.max(...ys), W: r.width, H: r.height, hudBottom: document.getElementById('spawnbar').getBoundingClientRect().bottom };
  },
  addScore(n) { score += n; }, setFx, get fx() { return fxLevel; }, get poolSize() { return diePool.length; }, perf, resetPerf() { perf.maxCpu = 0; perf.n = 0; perf.cpu.fill(0); }, get started() { return started; }, get best() { return best; },
  get mode() { return drag ? drag.mode : null; },
  get chains() { return chains.map((c) => ({ t: c.t, dur: c.dur, n: dice.filter((d) => d.chain === c).length })); },
  get view() { return view; }, setView(v) { setView(v, true); },
  dirFor(gx, gy, vx, vy) { const d = grid[gy][gx]; const k = dirFromDrag(d, vx, vy); return Object.keys(DIR4).find((n) => DIR4[n] === k); },
  labelsVisible() { return Object.entries(labels).filter(([, l]) => l.visible).map(([k]) => k); },
  // place a die at (gx,gy) such that rolling it in dirName (N/S/E/W) yields resultTop
  placeFor(gx, gy, dirName, resultTop) {
    const dir = DIR4[dirName];
    for (let i = 0; i < 500; i++) {
      const q = randomQuat();
      const r = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(dir[1], 0, -dir[0]), Math.PI / 2).multiply(q);
      if (topOf(snapQuat(r)) === resultTop) { const d = makeDie(gx, gy, q, 0); d.t = 1; d.state = 'idle'; d.bounce = 1; d.mesh.position.set(wx(gx), H, wx(gy)); return d.top; }
    }
    return null;
  },
  opposite() { return dice.every((d) => { let ok = true; for (let i = 0; i < 6; i += 2) { const a = FACE_VAL[i], b = FACE_VAL[i + 1]; if (a + b !== 7) ok = false; } return ok; }); }
};
